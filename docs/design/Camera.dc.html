<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Jost:wght@400;500;600&amp;display=swap">
<style>
:root{--f:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;--fn:'Jost','Futura','Avenir Next',-apple-system,sans-serif;--t1:#F5F5F7;--t2:rgba(245,245,247,.62);--t3:rgba(245,245,247,.38);--line:rgba(245,245,247,.16)}
body{margin:0;background:#0a0a0b}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid #F5F5F7;outline-offset:3px}
/* type system: one family, six roles */
.t-disp{font:600 64px/.9 var(--fn);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-pre{font:500 34px/1 var(--fn);opacity:.7}
.t-val{font:600 17px/1 var(--fn);font-variant-numeric:tabular-nums}
.t-leg{font:600 14px/1 var(--fn);letter-spacing:.08em}
.t-ttl{font:600 15px/1 var(--f)}
.t-body{font:500 13px/1.2 var(--f)}
.t-cap{font:500 11px/1 var(--f);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.t-over{font:600 10px/1 var(--f);letter-spacing:.1em;text-transform:uppercase}
.glass{background:rgba(28,28,30,.42);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:.5px solid rgba(255,255,255,.18)}
.press{transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.press:active{transform:scale(.94)}
@keyframes hlA{0%{opacity:0;transform:scaleX(0)}100%{opacity:1;transform:none}}
@keyframes hlB{0%{opacity:0;transform:scaleX(0)}100%{opacity:1;transform:none}}
@keyframes vlA{0%{opacity:0;transform:scaleY(0)}100%{opacity:1;transform:none}}
@keyframes vlB{0%{opacity:0;transform:scaleY(0)}100%{opacity:1;transform:none}}
@keyframes labA{0%{opacity:0;letter-spacing:.6em}100%{opacity:1}}
@keyframes labB{0%{opacity:0;letter-spacing:.6em}100%{opacity:1}}
@keyframes brkA{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}30%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes brkB{0%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}30%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:none}}
@keyframes scanA{0%{opacity:0;transform:translateY(-46px)}12%{opacity:1}100%{opacity:0;transform:translateY(240px)}}
@keyframes scanB{0%{opacity:0;transform:translateY(-46px)}12%{opacity:1}100%{opacity:0;transform:translateY(240px)}}
@keyframes cntA{0%{opacity:0;filter:blur(4px)}20%{opacity:.3}35%{opacity:1}45%{opacity:.4}60%{opacity:1;filter:none}100%{opacity:1}}
@keyframes cntB{0%{opacity:0;filter:blur(4px)}20%{opacity:.3}35%{opacity:1}45%{opacity:.4}60%{opacity:1;filter:none}100%{opacity:1}}
@keyframes rowA{0%{opacity:0;transform:translateY(18px) scale(.94);filter:blur(8px)}55%{opacity:1;transform:translateY(-3px) scale(1.015);filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes rowB{0%{opacity:0;transform:translateY(18px) scale(.94);filter:blur(8px)}55%{opacity:1;transform:translateY(-3px) scale(1.015);filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes popA{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes popB{0%{transform:scale(.8)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes tickA{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tickB{from{opacity:.3;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flipA{from{opacity:.2;transform:rotateX(70deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes flipB{from{opacity:.2;transform:rotateX(70deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes huntA{0%{opacity:0;transform:scale(1.7);color:#F5F5F7}16%{opacity:1;transform:scale(1)}50%{color:#F5F5F7}60%{color:var(--ac)}82%{opacity:1;color:var(--ac)}100%{opacity:0;color:var(--ac)}}
@keyframes huntB{0%{opacity:0;transform:scale(1.7);color:#F5F5F7}16%{opacity:1;transform:scale(1)}50%{color:#F5F5F7}60%{color:var(--ac)}82%{opacity:1;color:var(--ac)}100%{opacity:0;color:var(--ac)}}
@keyframes rackA{0%{filter:blur(5px)}55%{filter:blur(1.2px)}100%{filter:blur(0)}}
@keyframes rackB{0%{filter:blur(5px)}55%{filter:blur(1.2px)}100%{filter:blur(0)}}
@keyframes toastA{0%{opacity:0;transform:translateY(-6px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@keyframes toastB{0%{opacity:0;transform:translateY(-6px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
@keyframes blkA{0%{opacity:0}28%{opacity:.92}100%{opacity:0}}
@keyframes blkB{0%{opacity:0}28%{opacity:.92}100%{opacity:0}}
@keyframes slapA{0%{transform:scale(1);filter:brightness(1)}22%{transform:scale(.978);filter:brightness(.65)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes slapB{0%{transform:scale(1);filter:brightness(1)}22%{transform:scale(.978);filter:brightness(.65)}100%{transform:scale(1);filter:brightness(1)}}
@keyframes bloomA{from{transform:scale(1.32)}to{transform:scale(1.15)}}
@keyframes bloomB{from{transform:scale(1.32)}to{transform:scale(1.15)}}
@keyframes glowA{0%{opacity:0}25%{opacity:.5}100%{opacity:0}}
@keyframes glowB{0%{opacity:0}25%{opacity:.5}100%{opacity:0}}
@keyframes thumbA{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes thumbB{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes cntA{0%{transform:translateY(-9px);opacity:0}100%{transform:none;opacity:1}}
@keyframes cntB{0%{transform:translateY(-9px);opacity:0}100%{transform:none;opacity:1}}
@keyframes drainA{from{width:100%}to{width:0}}
@keyframes drainB{from{width:100%}to{width:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes eyeA{0%{transform:scale(1.6)}50%{transform:scale(.82)}100%{transform:scale(1)}}
@keyframes eyeB{0%{transform:scale(1.6)}50%{transform:scale(.82)}100%{transform:scale(1)}}
@keyframes lockA{0%{opacity:0;transform:scale(1.7)}55%{opacity:1;transform:scale(.88)}100%{opacity:1;transform:scale(1)}}
@keyframes lockB{0%{opacity:0;transform:scale(1.7)}55%{opacity:1;transform:scale(.88)}100%{opacity:1;transform:scale(1)}}
@keyframes ringA{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
@keyframes ringB{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2)}}
@keyframes notchA{0%{transform:translateX(0)}35%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes notchB{0%{transform:translateX(0)}35%{transform:translateX(4px)}100%{transform:translateX(0)}}
@keyframes grainJ{0%{transform:translate(0,0)}20%{transform:translate(-14px,9px)}40%{transform:translate(11px,-12px)}60%{transform:translate(-7px,-15px)}80%{transform:translate(13px,6px)}100%{transform:translate(0,0)}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;box-sizing:border-box;background:#0a0a0b;color:#F5F5F7;font-family:-apple-system,'SF Pro Display','Inter',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171a30"></stop><stop offset=".45" stop-color="#6a4a62"></stop><stop offset=".72" stop-color="#f0a766"></stop></linearGradient>
      <radialGradient id="sg"><stop offset="0" stop-color="#ffe6b8" stop-opacity=".9"></stop><stop offset="1" stop-color="#ffe6b8" stop-opacity="0"></stop></radialGradient>
      <linearGradient id="wt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c98a62"></stop><stop offset="1" stop-color="#1b1624"></stop></linearGradient>
      <filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.1 0"></feColorMatrix></filter>
    </defs>
  </svg>

  <!-- ambient: the scene's light, pulled toward one warm neutral -->
  <div style="position:absolute;inset:-60px;filter:{{ambFilter}};transition:filter .5s ease;transform:scale(1.15);animation:{{ambAnim}}">
    <svg viewBox="0 0 366 460" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true">
      <rect width="366" height="460" fill="url(#sk)"></rect>
      <g style="transform:translateX({{sunShift}}px)"><circle cx="250" cy="232" r="130" fill="url(#sg)"></circle><circle cx="250" cy="232" r="28" fill="#ffe2b0"></circle></g>
      <path d="M0 270 L50 250 L110 280 L170 236 L235 268 L290 252 L366 276 V372 H0Z" fill="#3b3250"></path>
      <path d="M0 318 L70 292 L140 326 L210 288 L285 330 L366 300 V372 H0Z" fill="#241e33"></path>
      <rect y="372" width="366" height="88" fill="url(#wt)"></rect>
    </svg>
  </div>
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,9,.1) 0%,rgba(8,8,9,0) 18%,rgba(8,8,9,.1) 50%,rgba(8,8,9,.82) 100%)"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 60% 40%,#ffd9a8,rgba(255,217,168,0) 60%);opacity:0;animation:{{glowAnim}};pointer-events:none"></div>

  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:230px;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(75% 85% at 62% 18%,rgba(255,190,125,{{topGlow}}),rgba(255,190,125,0) 72%);transition:background .6s ease"></div>
  <!-- top menu: current mode + focal length, always present -->
  <div style="position:absolute;left:22px;right:16px;top:48px;height:40px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;flex-direction:column;gap:1px">
      <span class="t-ttl" style="animation:{{modeAnim}};text-shadow:0 0 18px rgba(255,190,125,{{topGlow}})">{{modeName}}</span>
      <span class="t-cap" style="color:var(--t2)">{{modeSub}}</span>
    </div>
    <button onClick="{{nextFocal}}" aria-label="{{focalAria}}" class="press glass" style="height:40px;min-width:84px;border-radius:20px;background:linear-gradient(180deg,rgba(255,205,150,{{spill}}),rgba(20,20,22,.4));box-shadow:0 0 30px rgba(255,170,90,{{glowA}});display:flex;align-items:center;justify-content:center;gap:3px;box-sizing:border-box">
      <span class="t-val">{{focalNow}}</span>
      <span class="t-cap" style="color:var(--t2)">mm</span>
    </button>
  </div>

  <!-- viewfinder -->
  <div style="position:absolute;left:12px;right:12px;top:94px;height:{{vfH}}px;transition:height .5s cubic-bezier(.3,1.1,.5,1);border-radius:36px;overflow:hidden;background:#000;box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.14)">

    <div style="position:absolute;inset:0;animation:{{slapAnim}}">
      <div style="position:absolute;inset:0;filter:{{vfFilter}};transform:scale({{zoomScale}});transform-origin:50% 40%;transition:filter .4s ease">
        <div style="position:absolute;inset:0;animation:{{rackAnim}}">
          <svg viewBox="0 0 366 460" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%" role="img" aria-label="Live view: golden hour over a lake, a person on the shore and mountain ridges">
            <rect width="366" height="460" fill="url(#sk)"></rect>
            <g style="transform:translateX({{sunShift}}px)">
              <circle cx="250" cy="232" r="130" fill="url(#sg)"></circle>
              <circle cx="250" cy="232" r="28" fill="#ffe2b0"></circle>
            </g>
            <ellipse cx="90" cy="190" rx="100" ry="4" fill="#f6c9a0" opacity=".22"></ellipse>
            <g style="filter:blur({{farBlur}}px)">
              <path d="M0 270 L50 250 L110 280 L170 236 L235 268 L290 252 L366 276 V372 H0Z" fill="#3b3250"></path>
              <path d="M0 318 L70 292 L140 326 L210 288 L285 330 L366 300 V372 H0Z" fill="#241e33"></path>
              <path d="M0 270 L50 250 L110 280 L170 236 L235 268 L290 252 L366 276" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linejoin="round" style="opacity:{{peakFar}};transition:opacity .3s"></path>
            </g>
            <rect y="372" width="366" height="88" fill="url(#wt)"></rect>
            <g style="transform:translateX({{sunShift}}px)" fill="#ffe2b0">
              <rect x="226" y="384" width="48" height="2.5" rx="1.2" opacity=".6"></rect>
              <rect x="234" y="398" width="32" height="2.5" rx="1.2" opacity=".45"></rect>
              <rect x="240" y="412" width="20" height="2.5" rx="1.2" opacity=".3"></rect>
            </g>
            <g style="filter:blur({{nearBlur}}px)">
              <path d="M0 372 L0 352 L80 338 L160 358 L250 342 L366 356 V372 Z" fill="#0d0b12"></path>
              <g fill="#15101c" stroke="rgba(255,214,160,.7)" stroke-width=".8">
                <circle cx="97" cy="305" r="8"></circle>
                <rect x="88" y="313" width="18" height="24" rx="7"></rect>
                <rect x="90" y="334" width="5" height="9" rx="2"></rect>
                <rect x="98" y="334" width="5" height="9" rx="2"></rect>
              </g>
              <g fill="none" stroke="{{accent}}" stroke-width="1.5" style="opacity:{{peakNear}};transition:opacity .3s">
                <circle cx="97" cy="305" r="8.6"></circle>
                <rect x="87.4" y="312.4" width="19.2" height="25.2" rx="7.6"></rect>
              </g>
            </g>
          </svg>
        </div>
      </div>
      <svg viewBox="0 0 366 460" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;filter:blur(14px);opacity:{{halOp}};pointer-events:none">
        <g style="transform:translateX({{sunShift}}px)"><circle cx="250" cy="232" r="38" fill="#ff9a4a"></circle></g>
        <rect x="0" y="262" width="366" height="10" fill="#ff9a4a" opacity=".35"></rect>
      </svg>
      <div aria-hidden="true" style="position:absolute;inset:0;overflow:hidden;mix-blend-mode:overlay;opacity:{{grainOp}};pointer-events:none">
        <svg width="500" height="780" style="position:absolute;left:-60px;top:-60px;animation:grainJ .42s steps(1) infinite"><rect width="100%" height="100%" filter="url(#gr)"></rect></svg>
      </div>
      <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 52%,rgba(0,0,0,{{vigOp}}) 100%)"></div>
    </div>

    <svg viewBox="0 0 3 3" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:{{gridOp}};transition:opacity .25s ease">
      <path d="M1 0V3M2 0V3M0 1H3M0 2H3" stroke="rgba(255,255,255,.34)" stroke-width="1" fill="none" style="vector-effect:non-scaling-stroke"></path>
    </svg>
    <svg width="120" height="12" viewBox="0 0 120 12" aria-hidden="true" style="position:absolute;left:50%;top:50%;margin:-6px 0 0 -60px;pointer-events:none;opacity:{{lvlOp}};transition:opacity .25s ease">
      <path d="M0 6h44M76 6h44" stroke="rgba(245,245,247,.7)" stroke-width="1.5" stroke-linecap="round"></path>
      <path d="M52 6h16" stroke="{{accent}}" stroke-width="2" stroke-linecap="round"></path>
    </svg>

    <div role="group" aria-label="Viewfinder. Tap to focus, hold to lock, swipe sideways to change look" onPointerDown="{{vfDown}}" onPointerMove="{{vfMove}}" onPointerUp="{{vfUp}}" onPointerCancel="{{vfCancel}}" style="position:absolute;inset:0;touch-action:none"></div>

    <div aria-hidden="true" style="position:absolute;left:{{eyeX}}px;top:{{eyeY}}px;width:40px;height:40px;opacity:{{eyeOp}};transition:left .5s cubic-bezier(.3,1.1,.5,1),top .5s cubic-bezier(.3,1.1,.5,1),opacity .3s;pointer-events:none;animation:{{eyeAnim}}">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="{{accent}}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="animation:breathe 2.4s ease-in-out infinite">
        <path d="M3 13V6a3 3 0 0 1 3-3h7M27 3h7a3 3 0 0 1 3 3v7M37 27v7a3 3 0 0 1-3 3h-7M13 37H6a3 3 0 0 1-3-3v-7"></path>
        <path d="M10 20c3.2-4.2 6.2-6 10-6s6.8 1.8 10 6c-3.2 4.2-6.2 6-10 6s-6.8-1.8-10-6z"></path>
        <circle cx="20" cy="20" r="2.6" fill="{{accent}}" stroke="none"></circle>
      </svg>
    </div>

    <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true" style="--ac:{{accent}};color:#F5F5F7;position:absolute;left:{{fxPos}}px;top:{{fyPos}}px;opacity:0;pointer-events:none;animation:{{focusAnim}}">
      <path d="M4 18V4h14M46 4h14v14M60 46v14H46M18 60H4V46"></path>
    </svg>

    <sc-if value="{{lockOn}}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;pointer-events:none">
        <div aria-hidden="true" style="position:absolute;left:{{lockX}}px;top:{{lockY}}px;width:72px;height:72px;animation:{{lockAnim}}">
          <span style="position:absolute;inset:0;border-radius:22px;border:2px solid {{accent}}"></span>
          <span style="position:absolute;inset:0;border-radius:22px;border:2px solid {{accent}};opacity:0;animation:{{ringAnim}}"></span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:26px;top:26px"><rect x="5" y="11" width="14" height="9" rx="2.5"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
        </div>
        <button onClick="{{unlock}}" aria-label="Release AE and AF lock" class="glass t-over" style="pointer-events:auto;position:absolute;left:{{tagX}}px;top:{{tagY}}px;width:104px;height:28px;border-radius:14px;color:{{accent}};animation:{{lockAnim}}">AE · AF lock</button>
      </div>
    </sc-if>

    <div style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;animation:{{blinkAnim}}"></div>

    <!-- AI suggestion: one quiet line -->
    <button onClick="{{aiTap}}" aria-label="{{aiAria}}" style="position:absolute;left:12px;right:12px;top:8px;height:44px;display:flex;align-items:center;justify-content:center;gap:7px;text-shadow:0 1px 10px rgba(0,0,0,.6)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="{{accent}}" aria-hidden="true" style="flex:none"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"></path></svg>
      <span class="t-body" style="color:{{aiFg}};animation:{{aiAnim}};transition:color .25s">{{aiText}}</span>
    </button>

    <div style="position:absolute;left:0;right:0;top:56px;display:flex;justify-content:center;pointer-events:none">
      <div class="glass t-body" style="height:30px;padding:0 14px;border-radius:15px;display:flex;align-items:center;white-space:nowrap;opacity:0;animation:{{toastAnim}}">{{toastText}}</div>
    </div>

    <sc-if value="{{showInfo}}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:14px;right:14px;bottom:14px;height:32px;display:flex;align-items:center;pointer-events:none">
        <sc-if value="{{showScene}}" hint-placeholder-val="{{ true }}">
          <span class="glass t-cap" style="height:30px;padding:0 13px 0 11px;border-radius:15px;display:flex;align-items:center;gap:8px;box-sizing:border-box">
            <span aria-hidden="true" style="width:6px;height:6px;border-radius:50%;background:{{dotBg}};transition:background .3s"></span>
            <span style="animation:{{sceneAnim}}">{{sceneText}}</span>
          </span>
        </sc-if>
        <span class="t-cap" style="margin-left:auto;color:var(--t1);text-shadow:0 1px 8px rgba(0,0,0,.5)">[ <span style="display:inline-block;animation:{{cntAnim}}">{{frameLabel}}</span> ]</span>
      </div>
    </sc-if>

    <sc-if value="{{showHisto}}" hint-placeholder-val="{{ false }}">
      <div class="glass" aria-label="Histogram" role="img" style="position:absolute;left:14px;bottom:14px;width:104px;height:50px;border-radius:14px;box-sizing:border-box;padding:7px 8px;pointer-events:none">
        <svg width="88" height="36" viewBox="0 0 88 36" aria-hidden="true">
          <sc-for list="{{hbars}}" as="b" hint-placeholder-count="16">
            <rect x="{{b.x}}" y="{{b.y}}" width="3.6" height="{{b.h}}" rx="1" fill="#F5F5F7" opacity=".82"></rect>
          </sc-for>
        </svg>
      </div>
    </sc-if>

    <!-- focal rail -->
    <sc-if value="{{showZoom}}" hint-placeholder-val="{{ true }}">

<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0832A","options":["#F0832A","#E8553D","#F2C14E","#EDE7DA"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F0832A';
    const st = this.state || {};
    const c = (v, a, b) => Math.max(a, Math.min(b, v));
    const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {} };
    const mi = st.mi ?? 2, zf = st.zf ?? 0, look = st.look ?? 0;
    const di = st.di ?? 2, si = st.si ?? 2, isoI = st.isoI ?? 0, wbI = st.wbI ?? 0, mfI = st.mfI ?? 0, evI = st.evI ?? 9;
    const shots = st.shots ?? 0, mo = !!st.mo, ms = st.ms ?? 3, rw = st.rw ?? true, eye = !!st.eye, lock = !!st.lock;
    const sel = st.sel ?? 'ap';
    const modesL = ['Auto', 'P', 'A', 'S', 'M'];
    const modeNames = ['Auto', 'Program', 'Aperture', 'Shutter', 'Manual'];
    const modeSubs = ['', 'Camera decides', 'You set blur', 'You set motion', 'You set both'];
    const modeSel = ['ap', 'ev', 'ap', 'sh', 'ap'];
    const depthV = ['1.4', '1.8', '2.8', '4', '5.6', '8'];
    const speedV = ['60', '125', '250', '500', '1000'];
    const isoV = ['100', '200', '400', '800', '1600', '3200'];
    const wbV = ['Auto', 'Sun', 'Cloud', 'Warm'];
    const mfV = ['AF', '∞', '10', '5', '3', '2', '1'];
    const evL = ['−3', '−2', '−1', '0', '+1', '+2', '+3'];
    const wbF = ['', 'hue-rotate(-6deg) saturate(1.05)', 'hue-rotate(8deg)', 'sepia(.22) hue-rotate(-10deg)'];
    const lookN = ['Natural', 'Warm', 'Cool', 'Mono', 'Film'];
    const lookF = ['', 'sepia(.25) saturate(1.2) hue-rotate(-8deg)', 'saturate(1.05) hue-rotate(18deg) brightness(.97)', 'grayscale(1) contrast(1.1)', 'contrast(1.1) saturate(.82) sepia(.18)'];
    const zoomA = [1, 1.46, 2.08, 3.54];
    const focals = ['24', '35', '50', '85'];
    const pro = mi > 0, isM = mi === 4;
    const eA = mi === 2 || mi === 4, eS = mi === 3 || mi === 4;
    const evNow = (evI - 9) / 3;
    const vfH = pro ? 350 : 592;

    const dP = c(Math.round(2 - evNow * 0.5), 0, 5);
    const sP = c(Math.round(2 - evNow * 0.5), 0, 4);
    const dd = eA ? di : (mi === 3 ? c(Math.round(4 - si - evNow * 0.5), 0, 5) : dP);
    const ss = eS ? si : (mi === 2 ? c(Math.round(4 - di - evNow * 0.5), 0, 4) : sP);
    const meter = isM ? c(-0.6 * (di - 2) - 0.6 * (si - 2), -3, 3) : evNow;
    const bright = c(1 + 0.17 * meter, 0.45, 1.8);
    const lookStr = lookF[look] + ' ' + wbF[wbI];
    const sunShift = mo ? (ms - 6) * 22 : 0;
    const filmK = look === 4 ? 1.6 : 1;
    const evVal = Math.round(meter * 3) / 3;
    const evText = Math.abs(evVal) < 0.05 ? '0.0' : (evVal > 0 ? '+' : '−') + Math.abs(evVal).toFixed(1);

    // parameter table: one model for every control
    const PD = {
      ap: { k: 'di', d: 2, n: 6, on: eA, st: 20 },
      sh: { k: 'si', d: 2, n: 5, on: eS, st: 20 },
      iso: { k: 'isoI', d: 0, n: 6, on: true, st: 24 },
      wb: { k: 'wbI', d: 0, n: 4, on: true, st: 28 },
      mf: { k: 'mfI', d: 0, n: 7, on: true, st: 24 },
      ev: { k: 'evI', d: 9, n: 19, on: !isM, st: 12 }
    };
    const curOf = (p) => { const s = this.state || {}; const d = PD[p]; if (p === 'ap' && !d.on) return dd; if (p === 'sh' && !d.on) return ss; return s[d.k] ?? d.d; };
    const setP = (p, idx) => {
      const d = PD[p];
      const s = this.state || {};
      if (!d.on) {
        if (p === 'ev') return;
        // swiping an auto value hands control to you: jump to Manual, seeded from what auto chose
        buzz(10);
        this.setState({ ...modeCh(4), di: dd, si: ss });
        return;
      }
      const n = c(idx, 0, d.n - 1);
      if (n !== (s[d.k] ?? d.d)) { buzz(4); this.setState({ [d.k]: n, [d.k + 'k']: !s[d.k + 'k'] }); }
    };
    const cellH = (p) => ({
      down: (e) => {
        e.stopPropagation();
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        const s = this.state || {};
        this._sc = { p, x: e.clientX, y: e.clientY, v: curOf(p), m: false, was: (s.sel ?? 'ap') === p };
        buzz(3);
        this.setState({ sel: p, ac: p });
      },
      move: (e) => {
        const s = this._sc;
        if (!s || s.p !== p) return;
        const dx = e.clientX - s.x, dy = e.clientY - s.y;
        if (Math.abs(dx) + Math.abs(dy) > 6) s.m = true;
        if (!s.m) return;
        setP(p, s.v + Math.round((dx - dy) / PD[p].st));
      },
      up: (e) => {
        e.stopPropagation();
        const s = this._sc;
        this._sc = null;
        this.setState({ ac: null });
        if (s && s.p === p && !s.m && s.was) {
          buzz([6, 30, 6]);
          this.setState({ ex: !(this.state || {}).ex });
        }
      },
      kd: (e) => {
        const d = e.key === 'ArrowUp' || e.key === 'ArrowRight' ? 1 : e.key === 'ArrowDown' || e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        this.setState({ sel: p });
        setP(p, curOf(p) + d);
      }
    });
    const anim = (k) => st[k] === undefined ? 'none' : (st[k] ? 'tickA .24s cubic-bezier(.2,.8,.2,1) both' : 'tickB .24s cubic-bezier(.2,.8,.2,1) both');
    const pa = (k, n, tail) => st[k] === undefined ? 'none' : (st[k] ? n + 'A' : n + 'B') + tail;

    // moment
    const commit = () => { clearTimeout(this._mt); this.setState({ mo: false, dg: false }); };
    const restartKeep = () => { clearTimeout(this._mt); this._mt = setTimeout(commit, 3000); this.setState({ md: !(this.state || {}).md, dg: false }); };
    const openMoment = () => { this.setState({ mo: true, ms: 3 }); restartKeep(); };
    const shoot = () => {
      const s = this.state || {};
      buzz([10, 40, 14]);
      this.setState({ shots: (s.shots ?? 0) + 1, bk: !s.bk, cn: !s.cn, aok: false, ai: (s.ai ?? 0) + 1, aik: !s.aik });
      if ((s.mi ?? 2) > 0 && (s.rw ?? true)) setTimeout(openMoment, 560);
    };
    const stIdx = (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      return c(Math.floor((e.clientX - r.left) / r.width * 9), 0, 8);
    };

    // focal rail
    const setZ = (z) => {
      z = c(z, 0, 3);
      const ti = Math.round(z * 7);
      const s = this.state || {};
      if (this._zt !== undefined && ti !== this._zt) { buzz(4); this.setState({ zf: z, zn: !s.zn }); }
      else this.setState({ zf: z });
      this._zt = ti;
    };
    const animZ = (to) => {
      cancelAnimationFrame(this._zr);
      const from = (this.state || {}).zf ?? 0;
      const t0 = performance.now();
      const dur = 340 + Math.abs(to - from) * 60;
      const step = (t) => {
        const p = Math.min(1, (t - t0) / dur);
        const q = p - 1;
        const e = 1 + 2.6 * q * q * q + 1.6 * q * q;
        setZ(from + (to - from) * e);
        if (p < 1) this._zr = requestAnimationFrame(step);
        else { setZ(to); buzz(9); }
      };
      this._zr = requestAnimationFrame(step);
    };
    const fling = (v) => {
      cancelAnimationFrame(this._zr);
      let z = (this.state || {}).zf ?? 0;
      let last = performance.now();
      const step = (t) => {
        const dt = Math.min(32, t - last);
        last = t;
        z += v * dt;
        v *= Math.exp(-dt / 260);
        if (z <= 0 || z >= 3) { setZ(z); animZ(c(Math.round(z), 0, 3)); return; }
        setZ(z);
        if (Math.abs(v) < 0.00025) { animZ(c(Math.round(z), 0, 3)); return; }
        this._zr = requestAnimationFrame(step);
      };
      this._zr = requestAnimationFrame(step);
    };
    const zTicks = [];
    for (let i = -14; i <= 35; i++) {
      const y = 100 - zf * 70 + i * 10;
      if (y < -6 || y > 206) continue;
      const inRange = i >= 0 && i <= 21;
      const maj = i % 7 === 0 && inRange;
      const dist = Math.abs(y - 100);
      const w = Math.min(30, (maj ? 18 : 10) + c(10 - dist / 6, 0, 10));
      zTicks.push({
        y: y - 0.75,
        w,
        bg: dist < 4 && inRange ? accent : (!inRange ? 'rgba(245,245,247,.16)' : (maj ? 'rgba(245,245,247,.9)' : 'rgba(245,245,247,.42)'))
      });
    }
    const zLabels = focals.map((t, k) => {
      const y = 100 - zf * 70 + k * 70;
      return { t, y, fg: Math.abs(y - 100) < 18 ? '#F5F5F7' : 'rgba(245,245,247,.5)' };
    });
    const zi0 = Math.floor(c(zf, 0, 2.999)), zt = c(zf, 0, 3) - zi0;
    const zoomScale = zoomA[zi0] + (zoomA[Math.min(zi0 + 1, 3)] - zoomA[zi0]) * zt;
    const focalNow = Math.round(24 * zoomScale);

    // eye position
    const sc = Math.max(1, vfH / 460);
    const prj = (x, y) => {
      const px = (366 - 366 * sc) / 2 + x * sc, py = (vfH - 460 * sc) / 2 + y * sc;
      const ox = 183, oy = 0.4 * vfH;
      return { x: ox + (px - ox) * zoomScale, y: oy + (py - oy) * zoomScale };
    };
    const ep = prj(98, 305);
    const eyeIn = ep.x > 24 && ep.x < 342 && ep.y > 60 && ep.y < vfH - 50;

    // focus drives the scene: manual distance puts the focal plane near or far
    const apBlur = (5 - dd) * 0.5;
    const farBlur = apBlur + (mfI > 2 ? (mfI - 2) * 0.9 : 0);
    const nearBlur = mfI === 0 ? 0 : [0, 1.6, 1.1, 0.6, 0.2, 0, 0][mfI];
    const peakOn = !!st.peak;
    const farPk = mfI === 0 ? (eye ? 0 : 1) : (mfI <= 2 ? 1 : 0);
    const nearPk = mfI === 0 ? (eye ? 1 : 0) : (mfI >= 4 ? 1 : 0);

    // AI suggestions
    const aiList = [
      { t: 'Golden hour. Try the Warm look', go: () => this.setState({ look: 1, lk: !(this.state || {}).lk, tt: null }) },
      isM ? { t: 'Sun is hot. Speed up to 1/500', go: () => this.setState({ si: 3, sik: !(this.state || {}).sik }) } : { t: 'Sun is hot. Lower exposure', go: () => this.setState({ evI: 7 }) },
      { t: 'Add depth. Go to 50 mm', go: () => animZ(2) }
    ];
    if (pro) aiList.push({ t: 'Soften the ridge. Open to f/2.8', go: () => this.setState({ mi: eA ? mi : 2, di: 2, dik: !(this.state || {}).dik, sel: 'ap' }) });
    const aiI = (st.ai ?? 0) % aiList.length;
    const aok = !!st.aok;

    const frames = [];
    for (let k = 0; k < 9; k++) {
      const sx = 67 + (k - 6) * 6.15;
      const on = k === ms;
      frames.push({
        bg: 'radial-gradient(circle at ' + sx + '% 56%,#ffe6b8 0 9%,rgba(255,230,184,0) 17%),linear-gradient(180deg,#2a2840 0%,#c9784f 52%,#241e33 52%,#0d0b12 100%)',
        sc: on ? 1.2 : 1,
        op: on ? 1 : 0.6,
        ring: on ? '0 0 0 1.5px #F5F5F7' : 'none',
        best: k === 3
      });
    }

    // ruler: adapts to the selected parameter
    const dispOf = {
      ap: 'f/' + depthV[dd], sh: '1/' + speedV[ss], iso: isoV[isoI], wb: wbV[wbI],
      mf: mfI === 0 ? 'AF' : (mfV[mfI] === '∞' ? '∞' : mfV[mfI] + ' m'), ev: evText
    };
    const idxOf = { ap: dd, sh: ss, iso: isoI, wb: wbI, mf: mfI };
    const labsOf = { ap: depthV, sh: speedV, iso: isoV, wb: wbV, mf: mfV };
    const rOn = PD[sel].on;
    const rn = PD[sel].n;
    const norm = sel === 'ev' ? (c(meter, -3, 3) + 3) / 6 : idxOf[sel] / (rn - 1);
    const RW = 300;
    const rpos = norm * RW;
    const rticks = [], rlabels = [];
    const tot = sel === 'ev' ? 18 : (rn - 1) * 4;
    let best = 0, bd = 1e9;
    for (let j = 0; j <= tot; j++) { const d = Math.abs(j / tot * RW - rpos); if (d < bd) { bd = d; best = j; } }
    for (let j = 0; j <= tot; j++) {
      const maj = sel === 'ev' ? j % 3 === 0 : j % 4 === 0;
      rticks.push({ x: j / tot * RW - 0.75, h: j === best ? 16 : (maj ? 11 : 6), bg: j === best ? accent : (maj ? 'rgba(245,245,247,.7)' : 'rgba(245,245,247,.28)') });
    }
    const etk = [];
    for (let j = 0; j <= 18; j++) { const mj = j % 3 === 0, z = j === 9; etk.push({ x: j / 18 * 170 - 0.75, y: z ? 6 : (mj ? 10 : 13), h: z ? 16 : (mj ? 10 : 5), bg: z ? 'rgba(245,245,247,.9)' : (mj ? 'rgba(245,245,247,.6)' : 'rgba(245,245,247,.25)') }); }
    const needleX = (c(meter, -3, 3) + 3) / 6 * 170;
    const evLabs = Array.from({ length: 19 }, (_, i) => { const v = (i - 9) / 3; return v === 0 ? '0.0' : (v > 0 ? '+' : '\u2212') + Math.abs(v).toFixed(1); });

    const rIdxAt = (e) => {
      const r = e.currentTarget.getBoundingClientRect();

    };

    // histogram follows exposure
    const hbars = [];
    const raw = [];
    let mx = 0;
    for (let i = 0; i < 16; i++) {
      const sh = meter * 1.4;
      const v = 0.12 + 0.75 * Math.exp(-Math.pow(i - (4 + sh), 2) / 6) + 0.95 * Math.exp(-Math.pow(i - (11 + sh), 2) / 7);
      raw.push(v);
      mx = Math.max(mx, v);
    }
    raw.forEach((v, i) => { const h = Math.max(2, v / mx * 34); hbars.push({ x: i * 5.5, y: 36 - h, h }); });

    // shortcuts: seven functions, four slots, long-press to reassign
    const FN = [
      { id: 'eye', label: 'Eye AF', d: 'M3 8V5.5A2.5 2.5 0 0 1 5.5 3H8M16 3h2.5A2.5 2.5 0 0 1 21 5.5V8M21 16v2.5a2.5 2.5 0 0 1-2.5 2.5H16M8 21H5.5A2.5 2.5 0 0 1 3 18.5V16M7.5 12c1.3-1.9 2.8-2.8 4.5-2.8s3.2.9 4.5 2.8c-1.3 1.9-2.8 2.8-4.5 2.8S8.8 13.9 7.5 12z', on: eye },
      { id: 'lock', label: 'Lock', d: 'M5 11h14v9H5zM8 11V8a4 4 0 0 1 8 0v3', on: lock },
      { id: 'moment', label: 'Moment', d: 'M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 8v4l3 2', on: rw },
      { id: 'grid', label: 'Grid', d: 'M9 3v18M15 3v18M3 9h18M3 15h18', on: !!st.gridOn },
      { id: 'histo', label: 'Histo', d: 'M4 20V12M9 20V6M14 20V9M19 20V14', on: !!st.hist },
      { id: 'peak', label: 'Peaking', d: 'M3 18l5-9 4 6 3-4 6 7', on: peakOn },
      { id: 'level', label: 'Level', d: 'M2 12h7M15 12h7M9 12a3 3 0 0 0 6 0', on: !!st.lvl }
    ];
    const slots = st.sl ?? [0, 2];
    const tgl = (id) => {
      const s = this.state || {};
      buzz(8);
      if (id === 'eye') this.setState({ eye: !s.eye, fk: !s.fk, eyeK: !s.eyeK });
      else if (id === 'lock') {
        if (s.lock) this.setState({ lock: false });

        if (!z.m) return;
        const nz = c(z.z0 - dy / 70, 0, 3);
        setZ(nz);
        this._zs.push({ t: performance.now(), z: nz });
        if (this._zs.length > 5) this._zs.shift();
      },
      zUp: (e) => {
        const z = this._z;
        this._z = null;
        if (!z) return;
        if (!z.m) {
          const r = e.currentTarget.getBoundingClientRect();
          animZ(c(Math.round(z.z0 + (e.clientY - r.top - 100) / 70), 0, 3));
          return;
        }
        const sm = this._zs || [];
        let v = 0;
        if (sm.length > 1) {
          const a = sm[0], b = sm[sm.length - 1];
          if (performance.now() - b.t < 90 && b.t > a.t) v = (b.z - a.z) / (b.t - a.t);
        }
        if (Math.abs(v) > 0.0004) fling(Math.max(-0.006, Math.min(0.006, v)));
        else animZ(c(Math.round((this.state || {}).zf ?? 0), 0, 3));
      },
      zKey: (e) => {
        const d = e.key === 'ArrowUp' || e.key === 'ArrowRight' ? 1 : e.key === 'ArrowDown' || e.key === 'ArrowLeft' ? -1 : 0;
        if (!d) return;
        e.preventDefault();
        animZ(c(Math.round((this.state || {}).zf ?? 0) + d, 0, 3));
      },
      nextFocal: () => animZ((Math.round((this.state || {}).zf ?? 0) + 1) % 4),
      vfDown: (e) => {
        if ((this.state || {}).mo) return;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        const r = e.currentTarget.getBoundingClientRect();
        this._v = { x: e.clientX, y: e.clientY, px: e.clientX - r.left, py: e.clientY - r.top, lock: false };
        this.setState({ gd: true });
        clearTimeout(this._lp);
        this._lp = setTimeout(() => {
          const v = this._v;
          if (!v) return;
          v.lock = true;
          buzz(16);
          const s = this.state || {};
          this.setState({ lock: true, lx: v.px, ly: v.py, lkn: !s.lkn, fk: !s.fk });
        }, 480);
      },
      vfMove: (e) => {
        const v = this._v;
        if (!v) return;
        if (Math.abs(e.clientX - v.x) > 10 || Math.abs(e.clientY - v.y) > 10) clearTimeout(this._lp);
      },
      vfCancel: () => { clearTimeout(this._lp); this._v = null; this.setState({ gd: false }); },
      vfUp: (e) => {
        clearTimeout(this._lp);
        const v = this._v;
        this._v = null;
        this.setState({ gd: false });
        if (!v || v.lock) return;
        const dx = e.clientX - v.x, dy = e.clientY - v.y;
        const s = this.state || {};
        if (Math.abs(dx) >= 50 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          buzz(8);
          this.setState({ look: ((s.look ?? 0) + (dx < 0 ? 1 : 4)) % 5, lk: !s.lk, tt: null });
        } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {
          if (s.lock) { buzz(6); this.setState({ lock: false }); return; }
          buzz(6);
          this.setState({ fx: v.px, fy: v.py, fk: !s.fk });
        }
      },
      momentTitle: ms === 3 ? 'Moment · Best frame' : 'Moment',
      momentTime: ms === 6 ? 'On the press' : (ms < 6 ? '−' : '+') + (Math.abs(ms - 6) * 0.2).toFixed(1) + ' s',
      drainAnim: st.dg ? 'none' : (st.md ? 'drainA 3s linear forwards' : 'drainB 3s linear forwards'),
      stDown: (e) => {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
        clearTimeout(this._mt);
        this._st = true;
        this.setState({ ms: stIdx(e), dg: true });
      },
      stMove: (e) => {
        if (!this._st) return;
        const n = stIdx(e);
        if (n !== (this.state || {}).ms) { buzz(3); this.setState({ ms: n }); }
      },
      stUp: () => { if (this._st) { this._st = false; restartKeep(); } },
      scanOp: pro && rw && !mo ? 0.85 : 0,
      shScale: st.hp ? 0.88 : 1,
      ringScale: st.hp ? 0.95 : 1,
      shDown: () => {
        const s = this.state || {};
        buzz(6);
        this.setState(s.lock ? { hp: true } : { hp: true, fk: !s.fk });
      },
      shUp: () => { this.setState({ hp: false }); if ((this.state || {}).mo) commit(); else shoot(); },
      shCancel: () => this.setState({ hp: false }),
      shKey: (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if ((this.state || {}).mo) commit(); else shoot();
        }
      }
    };
  }
}
